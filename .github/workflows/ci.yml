name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check src tests bench source
      - run: uv run ruff format --check src tests bench source

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests
      - name: Run benchmarks as plain tests
        run: uv run pytest bench -p benchmark --benchmark-disable

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run pytest tests --cov=intset --cov-report=term-missing

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run sphinx-build -W -b html source build/html

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv build
      - name: Check that the built wheel installs and imports
        run: uv run --isolated --no-project --with dist/*.whl python -c "import intset; print(intset.__version__)"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
